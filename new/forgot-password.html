<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="combined-styles.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="forgot-password-container">
        <h2>Forgot Password</h2>
        <p>Enter your registered email to receive an OTP.</p>

        <form id="forgot-password-form">
            <div class="input-box">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <button type="submit" class="btn">Send OTP</button>
        </form>

        <a href="index.html" class="back-to-login">Back to Login</a>
    </div>

</body>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
    document.getElementById('forgot-password-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        
        if (!email) {
            alert('Please enter your email');
            return;
        }

        axios.post('http://localhost:3001/forgot-password', { email })
            .then(response => {
                alert('OTP sent to your email!');
                localStorage.setItem('email', email);  // Save email for next step (verification)
                window.location.href = 'resetPassword.html';  // Navigate to reset page
            })
            .catch(error => {
                console.error('Error sending OTP:', error);
                alert('Failed to send OTP. Please try again.');
            });
    });

</script>
</html>
